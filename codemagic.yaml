# Receta de Codemagic: compila el APK en la nube (no hace falta Android Studio).
# En Codemagic: agregar el repo -> elegir "codemagic.yaml" -> Start new build.
workflows:
  apk-despiece:
    name: APK Despiece (debug)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: v22.11.0
      java: 21
    scripts:
      - name: Instalar dependencias
        script: npm install
      - name: Compilar la app web (datos + Firebase incluidos)
        script: npm run build
      - name: Crear proyecto Android
        script: npx cap add android
      - name: Sincronizar con Android
        script: npx cap sync android
      - name: Generar APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
    # Opcional: recibir el APK por mail. Reemplazá el correo y descomentá.
    # publishing:
    #   email:
    #     recipients:
    #       - TU_CORREO@ejemplo.com
